events { worker_connections 1024; }

http {
    upstream web_app {
        server web:3001;
    }

    server {
        listen 80;

        # --- TIÊU CHÍ 3 & 6: HARDENING & SECURITY HEADERS ---
        # 1. Chống clickjacking
        add_header X-Frame-Options "SAMEORIGIN" always;
        # 2. Chống MIME-sniffing
        add_header X-Content-Type-Options "nosniff" always;
        # 3. Kích hoạt bộ lọc XSS
        add_header X-XSS-Protection "1; mode=block" always;
        # 4. Bảo vệ Referrer
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        # 5. Content Security Policy
        add_header Content-Security-Policy "default-src 'self' 'unsafe-inline' 'unsafe-eval' https: data:;" always;

        # Ẩn thông tin phiên bản Nginx
        server_tokens off;

        location / {
            proxy_pass http://web_app;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
