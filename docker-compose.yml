services:
  # 1. Nginx Reverse Proxy (Tiêu chí 3: HTTPS & Security Headers)
  nginx:
    image: nginx:alpine
    container_name: movie_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    networks:
      - frontend_net
    depends_on:
      - web

  # 2. Database MySQL (Tiêu chí 6: Network Isolation - chỉ nằm trong backend_net)
  mysql:
    image: mysql:8.0
    container_name: mysql_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: moviedb
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - backend_net

  # 3. Quản trị CSDL phpMyAdmin (Tiêu chí 2)
  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    container_name: movie_phpmyadmin
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      PMA_USER: root
      PMA_PASSWORD: rootpassword
    networks:
      - frontend_net
      - backend_net
    depends_on:
      - mysql

  # 4. Giám sát Database: MySQL Exporter
  mysql_exporter:
    image: prom/mysqld-exporter:latest
    container_name: mysql_exporter
    restart: unless-stopped
    volumes:
      - ./.my.cnf:/etc/.my.cnf:ro
    command:
      - '--config.my-cnf=/etc/.my.cnf'
    networks:
      - backend_net
    depends_on:
      - mysql

  # 5. Giám sát Hệ điều hành Ubuntu: Node Exporter
  node_exporter:
    image: prom/node-exporter:latest
    container_name: node_exporter
    restart: unless-stopped
    networks:
      - backend_net

  # 6. Giám sát Container Docker: cAdvisor (Tiêu chí 4)
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: movie_cadvisor
    restart: unless-stopped
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    networks:
      - backend_net

  # 7. Ứng dụng Web NodeJS (Tiêu chí 6: Non-root user)
  web:
    build: ./web
    container_name: movie_web
    dns:
      - 8.8.8.8
      - 1.1.1.1
    extra_hosts:
      - "api.themoviedb.org:3.169.173.63"
    environment:
      TMDB_API_KEY: ${TMDB_API_KEY:-}
      SESSION_SECRET: ${SESSION_SECRET:-dev-secret-change-me}
    restart: unless-stopped
    ports:
      - "3001:3001"
    networks:
      - frontend_net
      - backend_net
    depends_on:
      - mysql

  # 8. Hệ thống Giám sát: Prometheus
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prom_data:/prometheus
    networks:
      - frontend_net
      - backend_net

  # 9. Dashboard Giám sát: Grafana
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    networks:
      - frontend_net
      - backend_net
    depends_on:
      - prometheus

  # 10. Hệ thống Log tập trung: Loki (Tiêu chí 5)
  loki:
    image: grafana/loki:latest
    container_name: movie_loki
    user: "0:0"
    restart: unless-stopped
    ports:
      - "3100:3100"
    volumes:
      - ./monitoring/loki-config.yml:/etc/loki/local-config.yaml
      - loki_data:/tmp/loki
    networks:
      - frontend_net
      - backend_net

  # 11. Thu thập Log Docker: Promtail (Tiêu chí 5)
  promtail:
    image: grafana/promtail:latest
    container_name: movie_promtail
    restart: unless-stopped
    volumes:
      - ./monitoring/promtail-config.yml:/etc/promtail/config.yml
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command:
      - '-config.file=/etc/promtail/config.yml'
    networks:
      - backend_net
    depends_on:
      - loki

# --- TIÊU CHÍ 6: HARDENING & NETWORK ISOLATION ---
networks:
  frontend_net:
    driver: bridge
  backend_net:
    driver: bridge

volumes:
  mysql_data:
  grafana_data:
  prom_data:
  loki_data:
