global:
  scrape_interval: 10s

scrape_configs:
  - job_name: 'movie_web'
    static_configs:
      - targets: ['web:3001']

  - job_name: 'mysql_db'
    static_configs:
      - targets: ['mysql_exporter:9104']

  - job_name: 'ubuntu_node'
    static_configs:
      - targets: ['node_exporter:9100']

  - job_name: 'prometheus'
    static_configs:
      - targets: ['prometheus:9090']
